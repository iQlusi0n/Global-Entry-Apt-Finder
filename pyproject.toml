[project]
name = "ge-appointment-finder"
version = "0.1.0"
description = "Watch CBP Global Entry enrollment centers for new interview slots and push a notification via ntfy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Bernath" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["global-entry", "cbp", "ttp", "ntfy", "appointment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/iQlusi0n/Global-Entry-Apt-Finder"
Issues = "https://github.com/iQlusi0n/Global-Entry-Apt-Finder/issues"

[project.scripts]
ge-appointment-finder = "ge_appointment_finder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ge_appointment_finder"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "LOG", "G"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
